<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>لوحة التحكم - عالم حمودي الجنوبي</title>
    <style>
        @keyframes goldGlow {
            0% { text-shadow: 0 0 10px #ffb300, 0 0 20px #ff8f00; color: #ffb300; }
            50% { text-shadow: 0 0 20px #ffea00, 0 0 30px #ffd54f; color: #ffe57f; }
            100% { text-shadow: 0 0 10px #ffb300, 0 0 20px #ff8f00; color: #ffb300; }
        }
        body { font-family: Tahoma, sans-serif; background: #0b0b0e; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; direction: rtl; }
        .card { background: rgba(20, 20, 25, 0.95); border: 1px solid rgba(255, 179, 0, 0.3); padding: 30px; border-radius: 20px; width: 450px; box-shadow: 0 15px 35px rgba(0,0,0,0.9); text-align: center; }
        h1 { animation: goldGlow 3s infinite; font-size: 20px; margin-bottom: 10px; }
        p.subtitle { color: #aaa; font-size: 14px; margin-bottom: 25px; }
        .section-title { font-size: 14px; color: #ffb300; margin-bottom: 8px; text-align: right; }
        select, input[type="password"] { width: 100%; padding: 12px; margin-bottom: 15px; background: #16161a; border: 1px solid #444; border-radius: 8px; color: #fff; font-size: 14px; box-sizing: border-box; text-align: right; }
        select:focus, input:focus { border-color: #ffb300; outline: none; }
        .btn-gen { display: block; width: 100%; background: linear-gradient(135deg, #ffb300, #ff8f00); color: #000; padding: 12px; border: none; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; transition: 0.3s; margin-bottom: 20px; }
        .btn-gen:hover { box-shadow: 0 0 15px rgba(255, 179, 0, 0.6); }
        .btn-pass { display: block; width: 100%; background: #1e88e5; color: #fff; padding: 12px; border: none; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; transition: 0.3s; margin-bottom: 15px; }
        .btn-pass:hover { background: #1565c0; }
        .logout-link { color: #ff5252; text-decoration: none; font-size: 14px; font-weight: bold; }
        .logout-link:hover { text-decoration: underline; }
        .msg { background: #1b5e20; color: #fff; padding: 10px; border-radius: 8px; margin-bottom: 15px; font-size: 13px; }
    </style>
</head>
<body>
    <div class="card">
        <h1>✨ أهلاً بك في عالم حمودي الجنوبي ✨</h1>
        <p class="subtitle">لوحة التحكم الخاصة بالمالك: {{ user.name }}</p>

        {% if msg %}
            <div class="msg">{{ msg }}</div>
        {% endif %}

        <!-- نموذج توليد السؤال المرتبط بمسار /generate_question -->
        <form action="/generate_question" method="POST">
            <div class="section-title">⏱️ حدد وقت السؤال:</div>
            <select name="timer">
                <option value="1">دقيقة واحدة</option>
                <option value="2" selected>دقيقتان</option>
                <option value="5">5 دقائق</option>
            </select>
            <button type="submit" class="btn-gen">✨ توليد سؤال جديد بالذكاء الاصطناعي</button>
        </form>

        <hr style="border: 0; border-top: 1px solid #333; margin: 20px 0;">

        <!-- نموذج تغيير كلمة المرور -->
        <form action="/change_password" method="POST">
            <div class="section-title">🔑 تغيير كلمة المرور الخاصة بك:</div>
            <input type="password" name="new_pass" placeholder="أدخل الرمز الجديد" required>
            <button type="submit" class="btn-pass">🛡️ تحديث الرمز فوراً</button>
        </form>

        <a href="/logout" class="logout-link">تسجيل الخروج</a>
    </div>
</body>
</html>
