<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تسجيل دخول المشرفين - عالم حمودي الجنوبي</title>
    <style>
        @keyframes goldGlow {
            0% { text-shadow: 0 0 10px #ffb300, 0 0 20px #ff8f00; color: #ffb300; }
            50% { text-shadow: 0 0 20px #ffea00, 0 0 30px #ffd54f; color: #ffe57f; }
            100% { text-shadow: 0 0 10px #ffb300, 0 0 20px #ff8f00; color: #ffb300; }
        }

        body {
            font-family: Tahoma, sans-serif;
            background: #0b0b0e;
            background-image:
                radial-gradient(circle at 20% 30%, rgba(26, 26, 46, 0.6) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(35, 19, 39, 0.6) 0%, transparent 40%),
                linear-gradient(rgba(0,0,0,0.8), rgba(0,0,0,0.8));
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            direction: rtl;
        }

        .login-card {
            background: rgba(20, 20, 25, 0.85);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 179, 0, 0.2);
            padding: 35px;
            border-radius: 16px;
            width: 340px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            text-align: right;
        }

        h2 {
            text-align: center;
            animation: goldGlow 3s infinite;
            font-size: 24px;
            margin-bottom: 25px;
        }

        label {
            color: #b0bec5;
            font-size: 14px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0 16px 0;
            border-radius: 8px;
            border: 1px solid #333;
            background: #16161a;
            color: #fff;
            text-align: right;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            background: linear-gradient(135deg, #ffb300, #ff8f00);
            color: #000;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 16px;
            transition: 0.3s;
        }

        button:hover {
            background: linear-gradient(135deg, #ffa000, #ff6f00);
            box-shadow: 0 0 15px rgba(255, 179, 0, 0.4);
        }

        .error-msg {
            background: rgba(255, 82, 82, 0.1);
            border: 1px solid #ff5252;
            color: #ff5252;
            padding: 10px;
            border-radius: 6px;
            font-size: 13px;
            margin-bottom: 15px;
            text-align: center;
        }

        .forgot-pass {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #ffb300;
            text-decoration: none;
            font-size: 13px;
            border-top: 1px solid rgba(255,179,0,0.15);
            padding-top: 15px;
            transition: 0.2s;
        }

        .forgot-pass:hover {
            color: #ffe57f;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <h2>تسجيل الدخول</h2>

        {% if error %}
            <div class="error-msg">{{ error }}</div>
        {% endif %}

        <form method="POST">
            <label>اسم المستخدم:</label>
            <input type="text" name="username" placeholder="أدخل اسم المستخدم" required>
            <label>كلمة المرور:</label>
            <input type="password" name="password" placeholder="••••••••" required>
            <button type="submit">دخول</button>
        </form>

        <!-- زر الانتقال لصفحة تغيير الرمز برقم الموبايل -->
        <a href="/forgot_password" class="forgot-pass">
            🔑 هل نسيت الرمز؟ تغيير كلمة المرور عبر الرمز السري
        </a>
    </div>
</body>
</html>
