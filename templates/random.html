<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>كرسي الاعتراف المطور - عالم حمودي الجنوبي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; }
        @keyframes pulseGlow {
            0%, 100% { box-shadow: 0 0 20px rgba(236, 72, 153, 0.4); }
            50% { box-shadow: 0 0 40px rgba(234, 179, 8, 0.8); }
        }
        .glow-card { animation: pulseGlow 3s infinite; }
    </style>
</head>
<body class="bg-gradient-to-br from-gray-950 via-purple-950 to-indigo-950 text-white min-h-screen flex flex-col items-center justify-between p-4 selection:bg-pink-500 selection:text-white">

    <!-- رأس الصفحة -->
    <header class="w-full max-w-2xl text-center py-4">
        <h1 class="text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-pink-400 via-yellow-300 to-cyan-400">
            🪑 كرسي الاعتراف التحدي
        </h1>
        <p class="text-gray-400 text-xs mt-1">اختبر صراحتك وشجاعتك عبر 5 أسئلة تصاعدية!</p>
    </header>

    <!-- المحتوى الرئيسي -->
    <main class="w-full max-w-2xl flex flex-col gap-5 my-auto">

        <!-- شاشة اختيار مستوى الصعوبة (البداية) -->
        <div id="difficultyScreen" class="bg-white/10 backdrop-blur-xl rounded-3xl p-6 shadow-2xl border border-white/15 text-center flex flex-col gap-5">
            <h2 class="text-xl font-bold text-yellow-300"><i class="fa-solid fa-layer-group ml-2"></i>اختر مستوى قوة الأسئلة لجلسة التحدي:</h2>
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                <button onclick="startGame('easy')" class="group relative bg-gradient-to-br from-emerald-600 to-teal-700 hover:from-emerald-500 hover:to-teal-600 p-5 rounded-2xl shadow-lg transition-all transform hover:-translate-y-1 border border-emerald-400/30 flex flex-col items-center gap-2">
                    <i class="fa-solid fa-face-smile text-3xl text-emerald-200 group-hover:scale-110 transition-transform"></i>
                    <span class="font-bold text-lg">سهل وخفيف</span>
                    <span class="text-xs text-emerald-200/80">أسئلة لطيفة ومسلية</span>
                </button>
                <button onclick="startGame('medium')" class="group relative bg-gradient-to-br from-amber-600 to-orange-700 hover:from-amber-500 hover:to-orange-600 p-5 rounded-2xl shadow-lg transition-all transform hover:-translate-y-1 border border-amber-400/30 flex flex-col items-center gap-2">
                    <i class="fa-solid fa-face-grimace text-3xl text-amber-200 group-hover:scale-110 transition-transform"></i>
                    <span class="font-bold text-lg">متوسط الجرأة</span>
                    <span class="text-xs text-amber-200/80">تحتاج صراحة أكبر</span>
                </button>
                <button onclick="startGame('hard')" class="group relative bg-gradient-to-br from-rose-600 to-red-800 hover:from-rose-500 hover:to-red-700 p-5 rounded-2xl shadow-lg transition-all transform hover:-translate-y-1 border border-rose-400/30 flex flex-col items-center gap-2">
                    <i class="fa-solid fa-fire text-3xl text-rose-200 group-hover:scale-110 transition-transform animate-bounce"></i>
                    <span class="font-bold text-lg">صعب وناري 🔥</span>
                    <span class="text-xs text-rose-200/80">للشجعان فقط!</span>
                </button>
            </div>
        </div>

        <!-- شاشة السؤال الكبرى التفاعلية (مخفية بالبداية) -->
        <div id="gameScreen" class="hidden bg-white/10 backdrop-blur-xl rounded-3xl p-6 shadow-2xl border border-white/15 flex flex-col gap-6 glow-card">
            <!-- شريط التقدم -->
            <div class="flex justify-between items-center text-sm text-gray-300 border-b border-white/10 pb-3">
                <span id="questionProgress" class="bg-pink-500/20 text-pink-300 px-3 py-1 rounded-full font-bold border border-pink-500/30">السؤال 1 من 5</span>
                <span id="modeBadge" class="text-yellow-400 font-bold"></span>
            </div>

            <!-- الأيقونة والسؤال الكبير -->
            <div class="text-center py-4 flex flex-col items-center gap-4">
                <div class="w-16 h-16 rounded-2xl bg-gradient-to-tr from-purple-600 to-pink-500 flex items-center justify-center shadow-lg text-3xl animate-pulse">
                    <i class="fa-solid fa-question text-white"></i>
                </div>
                <h3 id="questionText" class="text-xl sm:text-2xl font-black text-white leading-relaxed px-2">
                    <!-- نص السؤال يظهر هنا -->
                </h3>
            </div>

            <!-- أزرار اختيار نسبة الصراحة بعد الإجابة -->
            <div class="flex flex-col gap-3 pt-2">
                <p class="text-xs text-center text-pink-300 font-semibold">كم كانت نسبة صراحة المتسابق في إجابته؟</p>
                <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
                    <button onclick="recordScore(25)" class="bg-red-500/20 hover:bg-red-500/40 border border-red-500/40 py-3 rounded-xl font-bold transition-all text-red-300">25% (تهرب)</button>
                    <button onclick="recordScore(50)" class="bg-yellow-500/20 hover:bg-yellow-500/40 border border-yellow-500/40 py-3 rounded-xl font-bold transition-all text-yellow-300">50% (نصف صريح)</button>
                    <button onclick="recordScore(75)" class="bg-blue-500/20 hover:bg-blue-500/40 border border-blue-500/40 py-3 rounded-xl font-bold transition-all text-blue-300">75% (شجاع)</button>
                    <button onclick="recordScore(100)" class="bg-emerald-500/20 hover:bg-emerald-500/40 border border-emerald-500/40 py-3 rounded-xl font-bold transition-all text-emerald-300">100% (صراحة تامة 🔥)</button>
                </div>
            </div>
        </div>

        <!-- شاشة النتائج النهائية (مخفية بالبداية) -->
        <div id="resultScreen" class="hidden bg-white/10 backdrop-blur-xl rounded-3xl p-8 shadow-2xl border border-white/15 text-center flex flex-col items-center gap-6">
            <div class="w-20 h-20 rounded-full bg-gradient-to-tr from-yellow-400 to-pink-600 flex items-center justify-center text-4xl shadow-xl animate-bounce">
                <i class="fa-solid fa-trophy text-white"></i>
            </div>
            <h2 class="text-2xl font-black text-yellow-300">انتهت جولة كرسي الاعتراف بنجاح!</h2>
            <div class="flex flex-col gap-2 bg-black/30 p-5 rounded-2xl w-full border border-white/10">
                <span class="text-gray-400 text-sm">النسبة الكلية لصراحة المتسابق:</span>
                <span id="finalScoreText" class="text-4xl font-black text-pink-400">0%</span>
                <p id="finalComment" class="text-xs text-gray-300 mt-1"></p>
            </div>
            <button onclick="resetGame()" class="bg-gradient-to-r from-pink-600 to-purple-600 hover:from-pink-500 hover:to-purple-500 font-bold py-3 px-8 rounded-xl shadow-lg transition-all w-full">
                🔄 بدء جولة جديدة
            </button>
        </div>

    </main>

    <!-- زر العودة للرئيسية -->
    <footer class="w-full max-w-2xl text-center py-3">
        <a href="/" class="inline-block bg-white/10 hover:bg-white/20 text-gray-300 hover:text-white py-2 px-6 rounded-xl transition-all text-xs font-semibold border border-white/10">
            ← العودة للرئيسية
        </a>
    </footer>

    <!-- سكربت اللعبة وتوليد الأسئلة -->
    <script>
        const questionPool = {
            easy: [
                "ما هو أكثر موقف محرج تعرضت له أمام عائلتك؟",
                "لو تم تعيينك رئيساً للوزراء ليوم واحد، ما هو أول قرار ستتخذه؟",
                "ما هي العادة السيئة التي تتمنى التخلص منها؟",
                "من هو الشخص الأكثر تأثير بحياتك ولماذا؟",
                "ما هي الأكلة التي لا يمكن أن تمل منها أبداً؟",
                "لو قيل لك اختر دولة تعيش فيها بقية حياتك، ماذا تختار؟"
            ],
            medium: [
                "ما هي أكبر كذبة كذبتها بحياتك ونجحت فيها؟",
                "هل فكرت يوماً بالانسحاب من كل شيء والاختفاء لفترة؟",
                "موقف تمنيت لو أنك تستطيع إرجاع الزمن لتغييره؟",
                "ما هو السر الذي تخفيه عن أقرب أصدقائك؟",
                "هل تعرضت للخيانة من شخص عزيز، وكيف تصرفت؟",
                "ما هي الكلمة التي تجرحك فوراً إذا وجهت إليك؟"
            ],
            hard: [
                "من هو الشخص الذي لا تستطيع مسامحته مهما حدث؟",
                "ما هو الشيء الذي تفعله سراً وتخاف أن يكتشفه أحد؟",
                "متى كانت آخر مرة بكيت فيها بحرقة ولماذا؟",
                "لو كان بإمكانك مسح شخص واحد من ذاكرتك للأبد، من يكون؟",
                "ما هو اعترافك الأجرأ الذي لم تكن تجرؤ على قوله لأحد؟",
                "هل شعرت بالغيرة الشديدة من شخص قريب منك، من هو؟"
            ]
        };

        let currentQuestions = [];
        let currentIndex = 0;
        let totalScoreSum = 0;
        let selectedModeName = "";

        function startGame(mode) {
            selectedModeName = mode === 'easy' ? 'سهل' : mode === 'medium' ? 'متوسط' : 'صعب وناري 🔥';
            document.getElementById('modeBadge').innerText = "المستوى: " + selectedModeName;

            // اختيار 5 أسئلة عشوائية فريدة بدون تكرار من الفئة المحددة
            let pool = [...questionPool[mode]];
            currentQuestions = [];
            for(let i = 0; i < 5; i++) {
                if(pool.length === 0) break;
                let randomIndex = Math.floor(Math.random() * pool.length);
                currentQuestions.push(pool.splice(randomIndex, 1)[0]);
            }

            currentIndex = 0;
            totalScoreSum = 0;

            document.getElementById('difficultyScreen').classList.add('hidden');
            document.getElementById('resultScreen').classList.add('hidden');
            document.getElementById('gameScreen').classList.remove('hidden');

            loadQuestion();
        }

        function loadQuestion() {
            document.getElementById('questionProgress').innerText = `السؤال ${currentIndex + 1} من 5`;
            document.getElementById('questionText').innerText = currentQuestions[currentIndex];
        }

        function recordScore(score) {
            totalScoreSum += score;
            currentIndex++;

            if(currentIndex < 5) {
                loadQuestion();
            } else {
                showResults();
            }
        }

        function showResults() {
            document.getElementById('gameScreen').classList.add('hidden');
            document.getElementById('resultScreen').classList.remove('hidden');

            let finalAverage = Math.round(totalScoreSum / 5);
            document.getElementById('finalScoreText').innerText = finalAverage + "%";

            let comment = "";
            if(finalAverage >= 90) {
                comment = "🏆 أسطورة الصراحة والشجاعة! لم تخفِ شيئاً وواجهت كرسي الاعتراف بكل قوة.";
            } else if(finalAverage >= 70) {
                comment = "🌟 صراحة عالية جداً وممتازة، أثبت شجاعتك الكبيرة على الكرسي.";
            } else if(finalAverage >= 50) {
                comment = "⚖️ صراحة مقبولة، لكن يبدو أنك تهربت من بعض الأسئلة الحساسة!";
            } else {
                comment = "🐢 تهرب واضح ومدافع قوي! كنت متحفظاً جداً ولم تكشف الكثير.";
            }
            document.getElementById('finalComment').innerText = comment;
        }

        function resetGame() {
            document.getElementById('resultScreen').classList.add('hidden');
            document.getElementById('difficultyScreen').classList.remove('hidden');
        }
    </script>
</body>
</html>
