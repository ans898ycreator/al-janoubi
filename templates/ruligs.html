<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قسم الأحكام - عالم حمودي الجنوبي</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 flex flex-col items-center justify-center min-h-screen p-4">

    <div class="bg-slate-900 border border-rose-500/40 rounded-3xl p-8 max-w-xl w-full text-center shadow-2xl">
        <h1 class="text-2xl font-bold text-rose-400 mb-4">⚖️ قسم الأحكام والتحديات</h1>

        <div id="rulingBox" class="bg-slate-800 p-6 rounded-2xl text-lg font-semibold mb-6 min-h-[100px] flex items-center justify-center text-slate-200">
            اضغط على الزر أدناه لسحب الحكم الفوري!
        </div>

        <button onclick="showRandomRuling()" class="bg-rose-500 hover:bg-rose-600 text-white font-bold px-6 py-3 rounded-xl transition shadow-lg mb-6">
            🎲 اسحب حكماً جديداً
        </button>

        <div>
            <a href="/" class="text-slate-400 hover:text-slate-200 text-xs underline">🏠 العودة للرئيسية</a>
        </div>
    </div>

    <script>
        const rulingsList = [
            "قلد صوت معلق رياضي لمدة 20 ثانية.",
            "امدح الشخص الذي يجلس على يمينك بكلمات جميلة.",
            "تكلم باللهجة البدوية في إجابتك القادمة.",
            "قم بعمل حركة مضحكة بوجهك لمدة 10 ثوانٍ.",
            "اقفز في مكانك 3 مرات بحماس."
        ];

        function showRandomRuling() {
            let randomIndex = Math.floor(Math.random() * rulingsList.length);
            document.getElementById('rulingBox').innerText = rulingsList[randomIndex];
        }
    </script>

</body>
</html>
