<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>بث مباشر - عالم حمودي الجنوبي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Cairo', sans-serif; }</style>
</head>
<body class="bg-[#0b0f19] text-white min-h-screen p-6 flex flex-col items-center justify-center">
    <div class="max-w-md w-full bg-[#131b2e] border border-amber-500/30 rounded-2xl p-6 text-center shadow-2xl flex flex-col gap-4">
        <h2 class="text-lg font-bold text-amber-400">📡 شاشة متابعة البث المباشر</h2>
        
        <div class="bg-[#0b0f19] p-6 rounded-xl border border-slate-800 min-h-[140px] flex items-center justify-center">
            <p id="live-display" class="text-amber-400 font-bold text-base animate-pulse">جاري الاتصال بالبث...</p>
        </div>

        <p class="text-xs text-slate-500">المشاهدون المتصلون: <span id="viewer-count" class="text-emerald-400 font-bold">0</span></p>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <script>
        const socket = io();

        socket.on('update_viewers', function(data) {
            document.getElementById('viewer-count').innerText = data.count;
        });

        socket.on('update_view', function(data) {
            const display = document.getElementById('live-display');
            if (display && data.message) {
                display.innerText = data.message;
            }
        });
    </script>
</body>
</html>
