<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر وسيشن البصرة</title>
    <!-- استيراد تايليند سي إس إس وتصميم الأصفاد -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
</head>
<body class="bg-[#0b0f19] text-white min-h-screen p-4 flex flex-col items-center justify-center">

    <!-- محتوى الصفحة الرئيسي الخاص بك -->
    <div class="text-center">
        <h1 class="text-3xl font-bold mb-4">لوحة التحكم والتحكم باللعبة</h1>
        <p class="text-gray-400 mb-6">عدد المشاهدين المتصلين: <span id="viewer-count" class="text-amber-400 font-bold">0</span></p>

        <!-- أزرار أو عناصر التجربة -->
        <div class="space-x-4 space-x-reverse">
            <button onclick="triggerAction()" class="bg-amber-500 text-black px-6 py-2 rounded-lg font-bold hover:bg-amber-400">تنفيذ حركة</button>
        </div>
    </div>

    <!-- نافذة إدخال الكود للمشاهدين -->
    <div id="code-modal" style="position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 9999; display: flex; align-items: center; justify-content: center;">
        <div style="background: #131b2e; padding: 25px; border-radius: 12px; text-align: center; border: 1px solid #334155; width: 90%; max-width: 350px;">
            <h3 style="color: #fff; margin-bottom: 15px;">أدخل كود الدخول للمشاهدة</h3>
            <input type="text" id="viewer-code-input" placeholder="اكتب الكود هنا..." style="width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #475569; background: #0b0f19; color: #fff; margin-bottom: 15px; text-align: center;">
            <button onclick="checkViewerCode()" style="background: #f59e0b; color: #000; border: none; padding: 10px 20px; border-radius: 6px; font-weight: bold; cursor: pointer; width: 100%;">دخول</button>
            <p id="error-msg" style="color: #ef4444; margin-top: 10px; font-size: 14px; display: none;">الكود غير صحيح!</p>
        </div>
    </div>

    <script>
        // تقدر تغير الكود من هنا باللي يعجبك وتدزه للمشاهدين
        const correctCode = "313";
        const isOwner = localStorage.getItem('is_admin_host') === 'true';

        // إذا كنت أنت المضيف، نخفي نافذة الكود فوراً
        if (isOwner) {
            document.getElementById('code-modal').style.display = 'none';
        }

        function checkViewerCode() {
            const userInput = document.getElementById('viewer-code-input').value.trim();
            if (userInput === correctCode) {
                document.getElementById('code-modal').style.display = 'none';

                // قفل العناصر تماماً عن المشاهد
                document.querySelectorAll('button, input, select, textarea, a, form, [onclick]').forEach(el => {
                    if(el.id !== 'viewer-code-input') {
                        el.removeAttribute('href');
                        el.removeAttribute('onclick');
                        el.style.pointerEvents = 'none';
                        el.style.opacity = '0.6';
                        el.style.cursor = 'not-allowed';
                    }
                });

                sessionStorage.setItem('viewer_authenticated', 'true');
            } else {
                document.getElementById('error-msg').style.display = 'block';
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            if (!isOwner) {
                if (sessionStorage.getItem('viewer_authenticated') === 'true') {
                    document.getElementById('code-modal').style.display = 'none';
                    document.querySelectorAll('button, input, select, textarea, a, form, [onclick]').forEach(el => {
                        el.removeAttribute('href');
                        el.removeAttribute('onclick');
                        el.style.pointerEvents = 'none';
                        el.style.opacity = '0.6';
                        el.style.cursor = 'not-allowed';
                    });
                }
            }
        });

        const socket = io();

        // تحديث عداد المشاهدين
        socket.on('update_viewers', function(data) {
            const counter = document.getElementById('viewer-count');
            if (counter) {
                counter.innerText = data.count;
            }
        });

        // استقبال الحالة العامة وتحديث الواجهة عند المشاهد
        socket.on('broadcast_state', function(data) {
            console.log("تحديث الحالة:", data);
        });

        // استقبال الحركات الفورية للمضيف
        socket.on('update_view', function(data) {
            console.log("حركة المضيف:", data);
            alert("تم تنفيذ حركة من المضيف!");
        });

        function triggerAction() {
            socket.emit('player_action', { type: 'click_action', message: 'تم الضغط من المضيف' });
        }
    </script>
</body>
</html>
